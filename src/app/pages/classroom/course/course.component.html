<div class="container text-white" style="margin-top: 8rem;">
  <div class="row">

    <div class="d-none d-md-block col-md-3 scroll" style="max-height: 80vh; overflow-y: auto">
      <h5 class="chakra-petch-bold-italic">Aulas</h5>
      <div *ngFor="let lesson of courseLessons" class="mb-3">
        <div class="border border-1 border-secondary rounded p-2 cursor-pointer" (click)="goToLesson(lesson)">
          <p class="fw-bold chakra-petch-bold-italic mb-1">{{ lesson.title }}</p>
          <small>{{ lesson.duration }}</small>
        </div>
      </div>
    </div>

    <div class=" col-12 col-md-9">

      <small class="mb-5 backToClassroom" (click)="backToClassroom()">
        <i class="bi bi-arrow-left"></i> Voltar para os cursos
      </small>

      <div class="my-4">
        <h3 class="chakra-petch-bold-italic text-color-primary">{{ courseData.title }}</h3>
      </div>

      <!-- SELECT MOBILE -->
      <label for="filter" class="d-md-none mb-2 chakra-petch-bold-italic">Aulas</label>
      <!-- <select class="form-select d-md-none mb-4" [(ngModel)]="selectedLesson" (ngModelChange)="selectLesson($event)"> -->
      <select class="form-select d-md-none mb-4" [ngModel]="selectedLesson?.id" (ngModelChange)="goToLessonById($event)">


        <option *ngFor="let lesson of courseLessons" [ngValue]="lesson.id">
          {{ lesson.title }}
        </option>

      </select>


      <div>
        <h5 class="chakra-petch-bold-italic mb-3">{{ selectedLesson!.title }}</h5>

        <p class="mb-5">{{ selectedLesson!.description }}</p>

        <div class="d-flex justify-content-center mt-4" [innerHTML]="safeLessonContent"></div>

      </div>

    </div>
  </div>
</div>
